name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci
      - run: npm run check
      - run: pip install -r requirements-test.txt
      - run: pytest -q
      - run: python scripts/check_package.py
      - run: git diff --exit-code -- custom_components/liquid_glass_navigation/www/liquid-glass-navigation.js
      - name: Validate tag and package
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          python scripts/package.py
      - name: Publish tested integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/liquid-glass-navigation.zip custom_components/liquid_glass_navigation/www/liquid-glass-navigation.js --generate-notes --verify-tag
